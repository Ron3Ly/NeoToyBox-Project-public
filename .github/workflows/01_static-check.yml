name: Public static checks
on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**', main]
permissions:
  contents: read
concurrency:
  group: public-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements-ci.txt
      - run: python tools/ci_check.py
  merge-gate:
    name: merge-gate
    needs: [static-validation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject every result except successful executed validation
        env:
          VALIDATION_RESULT: ${{ needs.static-validation.result }}
        run: |
          set -euo pipefail
          test "$VALIDATION_RESULT" = success
