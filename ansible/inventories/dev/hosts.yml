      disk_gb: 16
      onboot_order: 10
      os: debian
      name: dev-rproxy-vm
      vmid: 3110
      mac: 02:87:2d:77:6f:66
      ip: 10.82.1.10
      bridge: vmbr21
      gateway: 10.82.1.1
      vlan: null
    - kind: lxc
      cores: 2
      memory_mb: 2048
      disk_gb: 16
      onboot_order: 10
