  children:
    pve_nodes:
      hosts:
        pve1:
          ansible_host: '{{ pve_ssh_host }}'
          ansible_user: ansible
    caddy_servers:
      hosts:
        dev-rproxy-vm:
          ansible_host: 10.82.1.10
    nextcloud_servers:
      hosts:
        dev-nc-lxc:
          ansible_host: 10.82.2.10
    imaginary_servers:
      hosts:
        dev-imagy-lxc:
          ansible_host: 10.82.2.11
    onlyoffice_servers:
      hosts:
        dev-oods-vm:
          ansible_host: 10.82.2.12
    mariadb_servers:
      hosts:
        dev-ncdb-lxc:
          ansible_host: 10.82.3.10
    valkey_servers:
